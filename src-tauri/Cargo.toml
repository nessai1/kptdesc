[package]
name = "kptdesc"
version = "0.1.0"
description = "КПТ-дневник с чекапами и недельным отчётом"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kptdesc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
